[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-data-platform"
version = "0.1.0"
description = "Batch data pipeline for a synthetic retail dataset."
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.40,<2",
    "dbt-core>=1.10,<2",
    "dbt-redshift>=1.10,<2",
    "prefect>=3,<4",
    "pyarrow>=20,<27",
]

[project.scripts]
retail-pipeline = "retail_pipeline.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.exceptions", "pyarrow", "pyarrow.parquet"]
ignore_missing_imports = true
